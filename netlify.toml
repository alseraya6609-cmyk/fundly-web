[build]
command = "npm run build"
publish = "dist"

# تطبيق صفحة واحدة: أي مسار يفتح index.html ويتولاه الموجّه.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
